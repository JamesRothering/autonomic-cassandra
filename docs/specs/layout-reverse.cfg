\* Positive check: deferred base tombstone (ADR-036), every rule enforced, both modes.
\* Expected: no violation. 2 coordinators, 1 write, 1 read.
SPECIFICATION Spec
CONSTANTS
    Coords = {c1, c2}
    Writes = {w1}
    Reads = {r1}
    MaxAttempts = 2
    Rows = {k1, k2}
    MaxTime = 4
    GcGrace = 2
    MaxRebackfills = 1
    MaxUnsplits = 1
    StartPhase = "STEADY"
    ForwardTombstone = FALSE
    EnforceO1 = TRUE
    EnforceC1 = TRUE
    EnforceDrain = TRUE
    EnforceResidueWindow = TRUE
    EnforcePurge = TRUE
    ProbeChecksResidue = TRUE
    EnforceReverseDeadline = TRUE
    EnforceBucketDeleteOrder = TRUE
INVARIANTS
    TypeOK
    I1
    I2
    I4
    I5
    I10
    I21
    I22
    I16
    I17
    I18
    I19
    I20
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
