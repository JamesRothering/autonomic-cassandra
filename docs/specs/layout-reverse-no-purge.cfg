\*
\* Negative variant: ForwardTombstone = TRUE, EnforcePurge = FALSE: slow mode does not wait for the purge.
\* Expected: I1/I22 (an acked write shadowed by basePD after the unsplit).
SPECIFICATION Spec
CONSTANTS
    Coords = {c1, c2}
    Writes = {w1}
    Reads = {}
    MaxAttempts = 2
    Rows = {k1, k2}
    MaxTime = 4
    GcGrace = 2
    MaxRebackfills = 1
    MaxUnsplits = 1
    StartPhase = "STEADY"
    ForwardTombstone = TRUE
    EnforceO1 = TRUE
    EnforceC1 = TRUE
    EnforceDrain = TRUE
    EnforceResidueWindow = TRUE
    EnforcePurge = FALSE
    ProbeChecksResidue = TRUE
    EnforceReverseDeadline = TRUE
    EnforceBucketDeleteOrder = TRUE
INVARIANTS
    TypeOK
    I1
    I4
    I5
    I10
    I21
    I22
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
