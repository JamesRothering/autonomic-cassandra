\*
\* Reachability probe ProbeFastUnsplit with the constants of layout-reverse-full.cfg:
\* split from ABSENT, then a fast unsplit. Expected: VIOLATED.
SPECIFICATION Spec
CONSTANTS
    Coords = {c1, c2}
    Writes = {w1}
    Reads = {}
    MaxAttempts = 1
    Rows = {k1, k2}
    MaxTime = 4
    GcGrace = 2
    MaxRebackfills = 1
    MaxUnsplits = 1
    StartPhase = "ABSENT"
    ForwardTombstone = FALSE
    EnforceO1 = TRUE
    EnforceC1 = TRUE
    EnforceDrain = TRUE
    EnforceResidueWindow = TRUE
    EnforcePurge = TRUE
    ProbeChecksResidue = TRUE
    EnforceReverseDeadline = TRUE
    EnforceBucketDeleteOrder = TRUE
INVARIANTS
    ProbeFastUnsplit
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
