\*
\* Positive check: rules O1 and C1 and the ANNOUNCED drain enforced. Expected: no
\* violation and no deadlock. Symmetry reduction over coordinators and writes is sound
\* here because every invariant is symmetric in both; without it the run is about 12x larger.
SPECIFICATION Spec
CONSTANTS
    Coords = {c1, c2, c3}
    Writes = {w1, w2}
    Reads = {r1}
    MaxAttempts = 2
    MaxRebackfills = 1
    EnforceO1 = TRUE
    EnforceC1 = TRUE
    EnforceDrain = TRUE
INVARIANTS
    TypeOK
    I1
    I2
    I4
    I5
    I10
SYMMETRY Symmetry
