\*
\* Negative variant: O1 and C1 enforced, but the owner does not hold ANNOUNCED until
\* operations that started before the key was registered have ended (ADR-028).
\* Expected: a client-visible invariant (I1, I4, I5 or I10) is violated.
SPECIFICATION Spec
CONSTANTS
    Coords = {c1, c2, c3}
    Writes = {w1, w2}
    Reads = {r1}
    MaxAttempts = 2
    MaxRebackfills = 1
    EnforceO1 = TRUE
    EnforceC1 = TRUE
    EnforceDrain = FALSE
INVARIANTS
    TypeOK
    I1
    I4
    I5
    I10
