\*
\* Positive check: a key split under the forward cleanup as built before ADR-036
\* (base tombstone at STEADY), so only slow mode. One row, so that no history row lies
\* above the tombstone and slow unsplits complete. Expected: no violation.
SPECIFICATION Spec
CONSTANTS
    Coords = {c1, c2}
    Writes = {w1}
    Reads = {r1}
    MaxAttempts = 2
    Rows = {k1}
    MaxTime = 4
    GcGrace = 2
    MaxRebackfills = 1
    MaxUnsplits = 1
    StartPhase = "STEADY"
    ForwardTombstone = TRUE
    EnforceO1 = TRUE
    EnforceC1 = TRUE
    EnforceDrain = TRUE
    EnforceResidueWindow = TRUE
    EnforcePurge = TRUE
    ProbeChecksResidue = TRUE
    EnforceReverseDeadline = TRUE
    EnforceBucketDeleteOrder = TRUE
INVARIANTS
    TypeOK
    I1
    I2
    I4
    I5
    I10
    I21
    I22
    I16
    I17
    I18
    I19
    I20
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
