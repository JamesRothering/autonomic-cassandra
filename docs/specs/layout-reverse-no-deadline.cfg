\*
\* Negative variant: ForwardTombstone = TRUE, EnforceReverseDeadline = FALSE (slow mode; in fast mode the
\* residue window implies the deadline). Expected: I22 (a base-only C0 delete purged,
\* then the reconcile copies the older overflow row).
SPECIFICATION Spec
CONSTANTS
    Coords = {c1, c2}
    Writes = {w1}
    Reads = {}
    MaxAttempts = 2
    Rows = {k1}
    MaxTime = 4
    GcGrace = 2
    MaxRebackfills = 1
    MaxUnsplits = 1
    StartPhase = "STEADY"
    ForwardTombstone = TRUE
    EnforceO1 = TRUE
    EnforceC1 = TRUE
    EnforceDrain = TRUE
    EnforceResidueWindow = TRUE
    EnforcePurge = TRUE
    ProbeChecksResidue = TRUE
    EnforceReverseDeadline = FALSE
    EnforceBucketDeleteOrder = TRUE
INVARIANTS
    TypeOK
    I1
    I4
    I5
    I10
    I21
    I22
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
