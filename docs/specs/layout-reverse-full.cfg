\*
\* Positive check: forward migration from ABSENT, then the reverse (from NEW_ONLY,
\* CLEANUP or STEADY), MaxAttempts = 1. Expected: no violation.
SPECIFICATION Spec
CONSTANTS
    Coords = {c1, c2}
    Writes = {w1}
    Reads = {}
    MaxAttempts = 1
    Rows = {k1, k2}
    MaxTime = 4
    GcGrace = 2
    MaxRebackfills = 1
    MaxUnsplits = 1
    StartPhase = "ABSENT"
    ForwardTombstone = FALSE
    EnforceO1 = TRUE
    EnforceC1 = TRUE
    EnforceDrain = TRUE
    EnforceResidueWindow = TRUE
    EnforcePurge = TRUE
    ProbeChecksResidue = TRUE
    EnforceReverseDeadline = TRUE
    EnforceBucketDeleteOrder = TRUE
INVARIANTS
    TypeOK
    I1
    I2
    I4
    I5
    I10
    I21
    I22
    I16
    I17
    I18
    I19
    I20
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
