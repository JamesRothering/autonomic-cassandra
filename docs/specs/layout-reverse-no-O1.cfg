\* Negative variant: EnforceO1 = FALSE: the owner does not wait for all-node acknowledgement.
\* Expected: I1.
SPECIFICATION Spec
CONSTANTS
    Coords = {c1, c2}
    Writes = {w1}
    Reads = {r1}
    MaxAttempts = 2
    Rows = {k1, k2}
    MaxTime = 4
    GcGrace = 2
    MaxRebackfills = 1
    MaxUnsplits = 1
    StartPhase = "STEADY"
    ForwardTombstone = FALSE
    EnforceO1 = FALSE
    EnforceC1 = TRUE
    EnforceDrain = TRUE
    EnforceResidueWindow = TRUE
    EnforcePurge = TRUE
    ProbeChecksResidue = TRUE
    EnforceReverseDeadline = TRUE
    EnforceBucketDeleteOrder = TRUE
INVARIANTS
    TypeOK
    I1
    I4
    I5
    I10
    I21
    I22
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
