\*
\* Reachability probe ProbePurgedAfterFast: after a fast unsplit an acked delete is purged from base.
\* Expected: VIOLATED.
SPECIFICATION Spec
CONSTANTS
    Coords = {c1, c2}
    Writes = {w1}
    Reads = {r1}
    MaxAttempts = 2
    Rows = {k1, k2}
    MaxTime = 4
    GcGrace = 2
    MaxRebackfills = 1
    MaxUnsplits = 1
    StartPhase = "STEADY"
    ForwardTombstone = FALSE
    EnforceO1 = TRUE
    EnforceC1 = TRUE
    EnforceDrain = TRUE
    EnforceResidueWindow = TRUE
    EnforcePurge = TRUE
    ProbeChecksResidue = TRUE
    EnforceReverseDeadline = TRUE
    EnforceBucketDeleteOrder = TRUE
INVARIANTS
    ProbePurgedAfterFast
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
