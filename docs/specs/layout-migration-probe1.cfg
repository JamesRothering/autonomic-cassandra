\*
\* Reachability probe ProbeSteady, one per run so TLC stops at the first violation.
\* Expected: VIOLATED (the trace shows the state is reachable).
SPECIFICATION Spec
CONSTANTS
    Coords = {c1, c2, c3}
    Writes = {w1, w2}
    Reads = {r1}
    MaxAttempts = 2
    MaxRebackfills = 1
    EnforceO1 = TRUE
    EnforceC1 = TRUE
    EnforceDrain = TRUE
INVARIANTS
    ProbeSteady
SYMMETRY Symmetry
