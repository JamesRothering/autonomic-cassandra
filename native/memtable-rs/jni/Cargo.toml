[package]
name = "memtable-jni"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = "1.25.2"
jni = "0.22.4"
memtable-core = { version = "0.1.0", path = "../core" }
mimalloc = { version = "0.1.52", default-features = false, optional = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Use mimalloc as the library's global allocator (see docs/spike/rust-memtable.md, "flush cost").
mimalloc = ["dep:mimalloc"]
