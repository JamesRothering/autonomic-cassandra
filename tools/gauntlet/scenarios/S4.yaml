name: S4
title: node crash (kill -9 of node 2), restart after 120 s
category: failure
expect: hints replay on return
fault_len: 120
load: {profile: gauntlet-mixed, ops: "ops(write=1,read=1)", rate: 500}
faults:
  - {at: 0, action: kill, node: 2}
  - {at: 120, quick_at: 35, action: start, node: 2}
