#
# Gauntlet stress profile: one wide partition (id = 1) takes about 30% of the operations; the rest is cold traffic on
# random partitions. Based on tools/autonomic/stress/hot-spot.yaml with RF 3 in datacenter1.
#
#   cassandra-stress user profile=profiles/gauntlet-hot.yaml "ops(hot_point=2,hot_write=1,cold_point=3,cold_write=4)" cl=QUORUM duration=60s -rate threads=32 fixed=500/s -node 127.0.0.1

keyspace: gauntlet_stress

keyspace_definition: |
  CREATE KEYSPACE gauntlet_stress WITH replication = {'class': 'NetworkTopologyStrategy', 'datacenter1': 3};

table: hotspot

table_definition: |
  CREATE TABLE hotspot (
        id int,
        seq int,
        v int,
        PRIMARY KEY (id, seq)
  )

# id is only bound by the cold queries; the hot queries use the literal partition 1
columnspec:
  - name: id
    population: uniform(2..100000)
  - name: seq
    population: uniform(1..100000)
  - name: v
    population: uniform(1..1000000)

queries:
   hot_point:
      cql: select v from hotspot where id = 1 and seq = ?
      fields: samerow
   hot_write:
      cql: insert into hotspot (id, seq, v) values (1, ?, ?)
      fields: samerow
   cold_point:
      cql: select v from hotspot where id = ? and seq = ?
      fields: samerow
   cold_write:
      cql: insert into hotspot (id, seq, v) values (?, ?, ?)
      fields: samerow
