#
# Hot spot: one wide partition (id = 1) takes most of the traffic, as in HotSpotScenarioTest.
# Hot point reads and slices, a few writes, and a little cold traffic on random partitions.
#
# cassandra-stress user profile=tools/autonomic/stress/hot-spot.yaml "ops(hot_point=6,hot_slice=2,hot_write=1,cold_point=1)" n=20000 -rate threads=8 -node 127.0.0.1

keyspace: autonomic_stress

keyspace_definition: |
  CREATE KEYSPACE autonomic_stress WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};

table: hotspot

table_definition: |
  CREATE TABLE hotspot (
        id int,
        seq int,
        v int,
        PRIMARY KEY (id, seq)
  )

# id is only bound by the cold queries; the hot queries use the literal partition 1
columnspec:
  - name: id
    population: uniform(2..100000)
  - name: seq
    population: uniform(1..100000)
  - name: v
    population: uniform(1..1000000)

queries:
   hot_point:
      cql: select v from hotspot where id = 1 and seq = ?
      fields: multirow
   hot_slice:
      cql: select seq, v from hotspot where id = 1 and seq >= ? limit 100
      fields: multirow
   hot_write:
      cql: insert into hotspot (id, seq, v) values (1, ?, ?)
      fields: multirow
   cold_point:
      cql: select v from hotspot where id = ? and seq = ?
      fields: multirow
