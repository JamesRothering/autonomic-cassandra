#
# Degraded node: a write-heavy mix of wide-ish blob rows on size-tiered compaction, which builds
# a compaction backlog on the node, as in DegradedNodeScenarioTest.
#
# cassandra-stress user profile=tools/autonomic/stress/degraded-node.yaml "ops(backlog_write=9,backlog_read=1)" n=20000 -rate threads=8 -node 127.0.0.1

keyspace: autonomic_stress

keyspace_definition: |
  CREATE KEYSPACE autonomic_stress WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};

table: degraded_backlog

table_definition: |
  CREATE TABLE degraded_backlog (
        id int,
        seq int,
        payload blob,
        PRIMARY KEY (id, seq)
  )
    WITH compaction = { 'class': 'SizeTieredCompactionStrategy' }

columnspec:
  - name: id
    population: uniform(1..10000)
  - name: seq
    population: uniform(1..1000)
  - name: payload
    size: uniform(256..2048)

queries:
   backlog_write:
      cql: insert into degraded_backlog (id, seq, payload) values (?, ?, ?)
      fields: multirow
   backlog_read:
      cql: select payload from degraded_backlog where id = ? and seq = ?
      fields: multirow
